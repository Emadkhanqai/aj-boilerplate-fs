# Response headers for every gateway response, included in EACH location that serves content.
#
# Why it is an include and not one server-level block: an `add_header` anywhere in a location
# REPLACES every `add_header` inherited from the server, so a location that sets even one header of
# its own would silently drop the whole set. Including this beside it keeps the set whole.
#
# The CSP is nonce-based for styles: PrimeNG and Angular inject <style> tags at run time, and
# `'nonce-$request_id'` allows exactly the ones carrying this request's nonce (the document gets the
# same value through `csp-nonce-document.conf`) without `'unsafe-inline'`. Scripts are 'self' only,
# which is why the production build sets `inlineCritical: false` (its inline `onload` handler would
# be blocked).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), bluetooth=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
