name: Frontend CI

# Gates, in order of how fast they fail:
#   install → lint → typecheck → unit tests (coverage) → production build
#           → dependency audit → Playwright E2E → quality gate → secret scan
#           → code scanning
#
# Every gate runs on pull requests EXCEPT the SonarQube quality gate, which runs
# only on pushes to main. That is a Community Build constraint, explained in full
# above the `quality-gate` job.

on:
  pull_request:
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/frontend

env:
  NODE_VERSION: '22'

jobs:
  # --------------------------------------------------------------------------
  # Gate 1 — install. A reproducible `npm ci` against the committed lockfile.
  # --------------------------------------------------------------------------
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

  # --------------------------------------------------------------------------
  # Gate 2 — lint, typecheck, and unit tests with coverage.
  #
  # These share a job because each is seconds of work after the install, and
  # splitting them would pay the `npm ci` cost three times over.
  # --------------------------------------------------------------------------
  verify:
    name: Lint, typecheck, unit tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: nx-set-shas needs it to compute the affected-project base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      # Sets NX_BASE/NX_HEAD correctly for both `pull_request` (diff against the merge base)
      # and `push` (diff against the previous commit). A plain `--base=origin/main` breaks on
      # a push to main itself, where the diff is empty or nonsensical.
      - uses: nrwl/nx-set-shas@v5

      - name: Lint
        run: npx nx affected -t lint --parallel=3

      # The `typecheck` target comes from the Nx TypeScript plugin. Where a project does not
      # define one, type checking is still fully covered by the AOT production build in the
      # next job — this step reports that honestly rather than silently passing.
      - name: Typecheck
        run: |
          if [ -n "$(npx nx show projects --with-target typecheck)" ]; then
            npx nx run-many -t typecheck --parallel=3
          else
            echo "No project defines a 'typecheck' target."
            echo "Type checking is covered by the Angular AOT production build (see the 'Build' job)."
          fi

      - name: Unit tests with coverage
        run: npx nx affected -t test --parallel=3 --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: src/frontend/coverage/**
          retention-days: 7

  # --------------------------------------------------------------------------
  # Gate 3 — production build. Also the real typecheck: Angular AOT compiles
  # every template and every binding.
  # --------------------------------------------------------------------------
  build:
    name: Build (production)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: nx build web --configuration=production
        run: npx nx build web --configuration=production

      # Bundle sizes, rendered into the job summary AND kept as an artifact.
      #
      # The budgets in `apps/web/project.json` only speak up once a threshold is crossed, which
      # makes the 40 kB a pull request quietly added invisible until the day some later PR trips
      # the ceiling and gets blamed for all of it. This makes every PR's actual numbers visible
      # in the checks tab without downloading anything.
      #
      # Pure shell over the emitted files — no bundle-analyzer dependency, no second build, no
      # stats.json. It reads a directory that already exists, so it costs roughly nothing.
      - name: Bundle size report
        if: always()
        shell: bash
        run: |
          # Fail loudly. An earlier draft of this step formatted sizes with `numfmt`, which is
          # GNU-only; where it is absent it prints an error per file and still exits 0, leaving a
          # neatly formatted table of EMPTY cells. A size report that silently reports nothing is
          # worse than no size report, because it looks like it worked.
          set -euo pipefail

          BROWSER_DIR=dist/apps/web/browser
          if [ ! -d "$BROWSER_DIR" ]; then
            echo "No build output at $BROWSER_DIR — the build step must have failed."
            exit 0
          fi

          # Decimal kB/MB, matching how the Angular builder reports sizes and how the budgets in
          # apps/web/project.json are evaluated, so the two can be compared without conversion.
          # Plain awk: portable, and no dependency to install.
          fmt() {
            awk -v b="$1" 'BEGIN {
              if (b >= 1000000) printf "%.2f MB", b / 1000000;
              else printf "%.1f kB", b / 1000;
            }'
          }

          {
            echo "### Bundle size"
            echo ""
            echo "| File | Raw | Gzipped |"
            echo "| --- | ---: | ---: |"
          } > bundle-size.md

          total_raw=0
          total_gz=0
          # Largest first: the top line is the one worth arguing about.
          while IFS= read -r file; do
            raw=$(wc -c < "$file" | tr -d ' ')
            gz=$(gzip -c "$file" | wc -c | tr -d ' ')
            total_raw=$((total_raw + raw))
            total_gz=$((total_gz + gz))
            printf '| `%s` | %s | %s |\n' "$(basename "$file")" "$(fmt "$raw")" "$(fmt "$gz")" >> bundle-size.md
          done < <(find "$BROWSER_DIR" -type f \( -name '*.js' -o -name '*.css' \) -exec ls -S {} +)

          printf '| **Total (all emitted JS/CSS)** | **%s** | **%s** |\n' \
            "$(fmt "$total_raw")" "$(fmt "$total_gz")" >> bundle-size.md

          {
            echo ""
            echo "_Gzipped is what a user actually downloads; budgets are enforced on RAW size._"
            echo "_This total covers every emitted script and stylesheet, so it is larger than the_"
            echo "_\`initial\` figure the budgets gate on — lazy chunks and static assets are included._"
            echo "_See \`src/frontend/CLAUDE.md\` for the budgets and their headroom._"
          } >> bundle-size.md

          cat bundle-size.md >> "$GITHUB_STEP_SUMMARY"
          cat bundle-size.md

      - name: Upload bundle size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-bundle-size
          path: src/frontend/bundle-size.md
          retention-days: 14

      - name: Upload build output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-output
          path: src/frontend/dist/**
          retention-days: 3

  # --------------------------------------------------------------------------
  # Gate 4 — dependency audit. Fails on high and critical advisories.
  # --------------------------------------------------------------------------
  dependency-audit:
    name: npm audit
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      # `npm audit` exits non-zero when it finds something at or above the level, which is
      # exactly what we want. The JSON report is kept so a failure is diagnosable.
      - name: npm audit --audit-level=high
        shell: bash
        run: |
          npm audit --audit-level=high --json > npm-audit.json || AUDIT_FAILED=1
          npm audit --audit-level=high || true
          if [ "${AUDIT_FAILED:-0}" = "1" ]; then
            echo "::error::npm audit found advisories at high severity or above."
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: src/frontend/npm-audit.json
          retention-days: 7

  # --------------------------------------------------------------------------
  # Gate 5 — Playwright end-to-end journeys against the production build.
  # --------------------------------------------------------------------------
  e2e:
    name: Playwright E2E
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: nx run web-e2e:e2e
        run: npx nx run web-e2e:e2e

      # Never add --update-snapshots here. A failing visual diff must fail the job so a human
      # looks at it; a self-updating baseline asserts nothing.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            src/frontend/dist/.playwright/**
            src/frontend/playwright-report/**
            src/frontend/test-results/**
          retention-days: 7

  # --------------------------------------------------------------------------
  # Gate 6 — the SonarQube quality gate.
  #
  # PUSH-TO-MAIN ONLY, AND THAT IS DELIBERATE.
  # This targets SonarQube Community Build (the free edition), which analyses
  # exactly ONE branch: the project's default branch. Every analysis lands on the
  # same project and overwrites the previous one, so scanning from a pull-request
  # build would replace main's result with the state of an unmerged branch.
  #
  # Consequently there is NO PULL-REQUEST DECORATION — Sonar findings never appear
  # as PR comments. Branch analysis and PR decoration start at Developer Edition
  # and this boilerplate deliberately does not depend on them. Pull requests are
  # gated by lint, typecheck, tests + coverage, the production build, npm audit,
  # Playwright, Gitleaks, and CodeQL, plus the local sonar-pre-push hook.
  # See .claude/standards/sonarqube.md.
  #
  # SEPARATE PROJECT KEY FROM THE BACKEND, also deliberate: two scanners pushing
  # to one Community project would overwrite each other on every run, and the
  # later one would win. Set the `SONAR_PROJECT_KEY_FRONTEND` repository variable.
  #
  # TypeScript needs only the generic SonarScanner CLI (this action). The C#
  # analyser is the one that must wrap the build — see backend-ci.yml.
  # --------------------------------------------------------------------------
  quality-gate:
    name: SonarQube quality gate
    needs: [verify, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SONAR_HOST_URL != '' && vars.SONAR_PROJECT_KEY_FRONTEND != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so SonarQube can attribute blame and compute "new code".
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      # run-many, not affected: the analysis covers the whole project, so the
      # coverage report has to as well.
      - name: Unit tests with lcov coverage
        run: npx nx run-many -t test --parallel=3 --coverage

      # No sonar.branch.name and no sonar.pullrequest.* — both need Developer
      # Edition or above. On Community Build this IS the default-branch analysis.
      - name: SonarScanner CLI
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: src/frontend
          # Everything except the key comes from `src/frontend/sonar-project.properties`,
          # which the CLI reads automatically from projectBaseDir. Do NOT re-state those
          # settings here: a `-D` argument OVERRIDES the file, so a stale inline copy
          # silently wins over the maintained one — which is exactly how local analysis
          # and CI drift apart while both appear to be configured.
          #
          # The key is the one thing passed in, so that a clone of this boilerplate cannot
          # report into another clone's project by inheriting a committed key.
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONTEND }}

  # --------------------------------------------------------------------------
  # Gate 7 — secret scanning. These repositories are public.
  # --------------------------------------------------------------------------
  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required for organisation-owned private repositories. Free for public ones.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Extends the default ruleset; allowlists only documented non-credentials.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.github/gitleaks.toml

  # --------------------------------------------------------------------------
  # Gate 8 — CodeQL code scanning.
  # --------------------------------------------------------------------------
  code-scanning:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
