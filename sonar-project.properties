# =============================================================================
# SonarQube — shared settings and project identity.
#
# TARGETS SONARQUBE COMMUNITY BUILD (the free, self-hosted edition). There is
# deliberately no `sonar.branch.name` and no `sonar.pullrequest.*` in any file here:
# branch analysis and pull-request decoration begin at Developer Edition. Community
# analyses exactly one branch — the project's default branch — so every analysis lands
# on the same project and overwrites the last one. Adding a branch parameter on
# Community does not give you branch analysis; it gives you a failed scan.
#
# Portfolios and Applications are also paid-tier and are not referenced anywhere.
#
# -----------------------------------------------------------------------------
# WHY THERE ARE THREE FILES AND NOT ONE
#
# The two stacks are analysed by two different scanners, and they do not read the same
# kind of configuration file. This is a property of the tools, not a choice made here:
#
#   THIS FILE (sonar-project.properties)
#       Read by: the plain SonarScanner CLI, IDE connected mode (SonarQube for IDE /
#       SonarLint), the SonarQube MCP server's project-key lookup, and
#       `.claude/hooks/sonar-pre-push.sh`, which resolves `sonar.projectKey` from here
#       when `SONAR_PROJECT_KEY` is not exported.
#
#   SonarQube.Analysis.xml
#       The BACKEND's analysis settings. The SonarScanner for .NET (MSBuild) does NOT
#       read `sonar-project.properties` — that is documented upstream and is the single
#       most common reason a .NET Sonar configuration silently has no effect. It reads
#       an XML settings file passed with `/s:<absolute-path>` instead. Backend settings
#       therefore live there and are NOT duplicated here, so there is nothing to drift.
#
#   sonar-project-frontend.properties
#       The FRONTEND's analysis settings. The frontend job scans with
#       `projectBaseDir: src/frontend`, and the CLI scanner reads
#       `sonar-project.properties` relative to that base directory — which is not this
#       file. See the header of that file for how it is wired in.
#
# -----------------------------------------------------------------------------
# HOW LOCAL AND CI ARE KEPT IN AGREEMENT
#
# `.claude/hooks/sonar-pre-push.sh` and `.github/workflows/backend-ci.yml` both pass
# `/s:<repo-root>/SonarQube.Analysis.xml` to the scanner. That file is the one place the
# backend's exclusions, coverage report path, and gate behaviour are stated. Before it
# existed, CI passed those settings inline as `/d:` arguments and the hook passed none of
# them, so a local scan and a CI scan analysed the same code under different rules and
# could disagree about the gate. That was the bug this file set fixes.
#
# Precedence, lowest to highest, for every scanner:
#   server-side project settings → settings file → `/d:` or `-D` command-line arguments
# So an inline argument in a workflow always wins. Keep the workflows free of analysis
# settings and this file set stays authoritative.
#
# -----------------------------------------------------------------------------
# DO NOT run the plain `sonar-scanner` CLI from this directory. It would try to analyse
# the C# tree without the MSBuild integration, which produces an analysis with no
# Roslyn results and no coverage while reporting success. The backend is analysed only
# by `dotnet sonarscanner begin/end` around a real build.
# =============================================================================

# --- Project identity --------------------------------------------------------
# This is the BACKEND project's key. `SONAR_PROJECT_KEY` (the environment variable
# locally, the repository variable in CI) always wins; the value here is the fallback the
# pre-push hook and the IDE use, and the thing a human reads to find out which project on
# the server this repository reports to.
#
# Replace both values when you clone. They are placeholders, not defaults that work.
sonar.projectKey=<your-org>_<your-repo>-backend
sonar.projectName=<Your Project> — Backend

# The version shown on the dashboard and used to attribute "new code" when the New Code
# definition is set to "previous version". Keep it in step with the tags described in
# CHANGELOG.md.
sonar.projectVersion=0.1.0

# --- Settings that apply to every analysis in this repository ----------------
sonar.sourceEncoding=UTF-8

# Enables blame-based attribution of new code and of issue authorship. Without it,
# "new code" degrades to a whole-project comparison and the gate stops being about
# your change.
sonar.scm.provider=git

# Never analyse build output, dependencies, or test artefacts. The frontend repeats the
# node/dist entries in its own file because exclusions are not inherited across the two
# scanners — they are two separate analyses of two separate projects.
sonar.exclusions=\
  **/bin/**,\
  **/obj/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/TestResults/**,\
  **/.nx/**,\
  **/.angular/**

# --- Quality gate behaviour --------------------------------------------------
# Makes the scanner's `end` step block until the server has computed the gate, and fail
# when the gate fails. Without it the scan uploads successfully and the job goes green
# regardless of the result, which is the most convincing way to have no gate at all.
#
# The thresholds themselves — zero new Blocker/Critical/Major, >=80% coverage on new
# code — live in the quality gate definition ON THE SERVER, not here. Keep it that way:
# a threshold in a file in the repository is a threshold a pull request can lower.
sonar.qualitygate.wait=true
