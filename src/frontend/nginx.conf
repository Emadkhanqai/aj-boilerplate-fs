# Every API service in this codebase calls relative `/api/v1/...` paths — same-origin by design,
# so `/api` is proxied internally to the backend container rather than the browser calling the
# API host cross-origin. Point `proxy_pass` at your own API service name/port.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # env.js is rewritten per container start (docker/40-env.sh) and referenced without a
    # cache-buster, so a cached copy would carry a previous deployment's auth config.
    location = /env.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
