# For a response that is an HTML DOCUMENT served from disk: stamp this request's nonce into it.
# `index.html` carries `<app-root ngCspNonce="__CSP_NONCE__">`; the value written here is the same
# `$request_id` that `security-headers.conf` puts in the CSP header.
#
# The nonce is only fresh if the document is never reused from a cache, so conditional requests are
# switched off and the document is `no-store`: a 304 would let the browser keep a stale nonce
# against a new header, and every PrimeNG style would then be blocked.
sub_filter '__CSP_NONCE__' '$request_id';
sub_filter_once off;
etag off;
if_modified_since off;
add_header Cache-Control "no-store" always;
